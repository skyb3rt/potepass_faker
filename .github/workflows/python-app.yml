# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Generate data

on:
  workflow_dispatch:
    inputs:
      antall_users:
        description: "Antall brukere"
        required: false
        default: "10"
      petsitters_antall:
        description: "Antall dyrepasere"
        required: false
        default: "5"
      bookings_antall:
        description: "Antall bookinger"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: isntall uv and Set up Python 3.14
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync
      - name: Generate files
        run: uv run main.py
        env:
          ANTALL_USERS: ${{ github.event.inputs.antall_users }}
          PETSITTERS_ANTALL: ${{ github.event.inputs.petsitters_antall }}
          BOOKINGS_ANTALL: ${{ github.event.inputs.bookings_antall }}
      - name: upload files
        uses: actions/upload-artifact@v4
        with:
          name: output-${{github.event.inputs.antall_users }}users-${{ github.event.inputs.petsitters_antall }}petsitters-${{ github.event.inputs.bookings_antall }}bookings
          path: output/*.json
